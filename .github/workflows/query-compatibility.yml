name: Query compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  highlights:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Validate highlights with Tree-sitter 0.26.11
        run: >-
          npm exec --yes --package tree-sitter-cli@0.26.11 --
          tree-sitter highlight
          --grammar-path .
          --query-paths queries/highlights.scm
          --check
          --quiet
          sample-file.sol
